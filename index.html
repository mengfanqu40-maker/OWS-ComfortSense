<!--
OWS ComfortSense v2.1 - 开放式耳机舒适度评估系统
学术演示版本
说明：此版本已移除所有敏感数据和具体算法实现，仅用于展示系统架构和设计理念
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OWS ComfortSense v2.1 - Academic Demo</title>
<style>
/* 基础样式变量 */
:root{
  --bg:#f0f2f5;
  --panel:#ffffff;
  --border:#e2e5ea;
  --text:#1a1d23;
  --muted:#8a909e;
  --green:#16c784;
  --mono:'DM Mono',monospace;
  --sans:'Noto Sans SC',sans-serif;
  --side-w: clamp(320px, 32vw, 480px);
}

/* 响应式布局 */
html,body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  font-size:17px;
}

/* 三栏布局 */
.body{display:flex;flex:1;overflow:hidden;}
.left,.right{
  width:var(--side-w);
  min-width:var(--side-w);
  background:var(--panel);
  overflow-y:auto;
  padding:20px 18px;
  display:flex;
  flex-direction:column;
  gap:22px;
  flex-shrink:0;
}
.left{border-right:1px solid var(--border);}
.right{border-left:1px solid var(--border);}
.center{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}

/* 热力图背景 */
.canvas-wrap{
  flex:1;
  position:relative;
  background:#ffffff;
  overflow:hidden;
  cursor:grab;
}

/* 响应式导出模态框 */
.modal{
  background:#fff;
  border-radius:16px;
  width:min(520px, calc(100vw - 32px));
  max-width:calc(100vw - 32px);
  max-height:calc(100vh - 32px);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.modal-body{
  overflow-y:auto;
  padding:16px 20px;
  flex:1;
  max-height:calc(100vh - 180px);
}

/* 按钮和交互元素 */
.sel{
  width:100%;
  border:1px solid var(--border);
  border-radius:7px;
  padding:16px 20px;
  font-size:22px;
  color:var(--text);
  background:#fff;
  appearance:none;
  cursor:pointer;
  font-family:var(--sans);
}

.stage-btn{
  width:100%;
  border-radius:9px;
  padding:18px 22px;
  font-size:22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
  border:2px solid transparent;
  margin-bottom:14px;
  font-family:var(--sans);
  transition:.15s;
}
.stage-btn.active{background:var(--text);color:#fff;}
.stage-btn:not(.active){background:#f8fafc;color:var(--muted);border-color:var(--border);}

.force-num{
  font-size:44px;
  font-weight:800;
  font-family:var(--mono);
  line-height:1;
  display:flex;
  align-items:baseline;
  gap:4px;
}

/* 评估结果卡片 */
.scard{
  background:linear-gradient(135deg,#f0fdf9,#dcfce7);
  border:2px solid #a7f3d0;
  border-radius:14px;
  padding:20px;
  position:relative;
  overflow:hidden;
}
.scard-lbl{
  font-size:20px;
  color:#059669;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.4px;
  margin-bottom:7px;
  font-family:var(--sans);
}
.scard-num{
  font-size:58px;
  font-weight:900;
  color:var(--green);
  line-height:1;
  font-family:var(--mono);
  transition:.4s;
}

/* 热力图图例 */
.hm-legend{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(255,255,255,.96);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px 20px;
  display:flex;
  align-items:center;
  gap:15px;
  font-size:22px;
  color:var(--muted);
  backdrop-filter:blur(8px);
  white-space:nowrap;
}
.hm-bar{
  width:140px;
  height:10px;
  border-radius:5px;
  background:linear-gradient(90deg,#ef4444,#f59e0b,#16c784);
}
</style>
</head>
<body>

<!-- 顶部导航栏 -->
<div class="topbar" style="height:46px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px;">
  <div style="display:flex;align-items:center;gap:10px;">
    <div class="logo" style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;">
      <div style="width:28px;height:28px;background:var(--text);border-radius:7px;"></div>
      OWS ComfortSense
    </div>
    <span style="font-size:15px;background:#f1f3f7;border:2px solid var(--border);color:var(--muted);padding:4px 12px;border-radius:20px;font-family:var(--mono);">v2.1</span>
  </div>
  <div style="display:flex;align-items:center;gap:14px;">
    <div style="display:flex;align-items:center;gap:6px;font-size:16px;color:var(--green);font-weight:500;">
      <div style="width:7px;height:7px;background:var(--green);border-radius:50%;animation:blink 2s infinite;"></div>
      实时计算
    </div>
    <div style="display:flex;align-items:center;gap:5px;background:var(--green-bg);border:1px solid #a7f3d0;border-radius:20px;padding:7px 18px;font-size:16px;font-weight:600;color:#059669;">
      舒适度 — / 7
    </div>
    <button style="background:var(--text);color:#fff;border:none;border-radius:7px;padding:11px 20px;font-size:16px;font-family:var(--sans);cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:500;">
      导出报告
    </button>
  </div>
</div>

<!-- 主体三栏布局 -->
<div class="body">
  <!-- 左侧控制面板 -->
  <div class="left">
    <div>
      <div style="font-size:20px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:16px;">耳机结构类型</div>
      <select class="sel">
        <option value="0">12 腰子形</option>
        <option value="1" selected>13.5 腰子形</option>
        <option value="2">12 圆柱形</option>
        <option value="3">13.5 圆柱形</option>
        <option value="4">12-14mm 球形</option>
        <option value="5">13.5-14mm 球形</option>
      </select>
    </div>

    <div>
      <div style="font-size:20px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:16px;">佩戴阶段</div>
      <button class="stage-btn active">初始佩戴</button>
      <button class="stage-btn">静坐结束</button>
      <button class="stage-btn">微动结束</button>
      <button class="stage-btn">跑步结束</button>
    </div>

    <div>
      <div style="font-size:20px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:16px;">接触力（夹紧力）</div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <div class="force-num">0.20<span style="font-size:18px;font-weight:500;color:var(--muted);">N</span></div>
        <span style="font-size:15px;padding:5px 14px;border-radius:20px;font-weight:600;background:#edfcf5;color:#059669;">● 安全</span>
      </div>
      <div style="position:relative;margin:10px 0 8px;">
        <input type="range" style="width:100%;height:26px;background:transparent;-webkit-appearance:none;cursor:pointer;margin:0;">

      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button style="flex:1;border:2px solid var(--border);border-radius:8px;padding:9px 0;font-size:15px;font-family:var(--mono);font-weight:600;color:var(--muted);background:#f8fafc;cursor:pointer;text-align:center;">0.1N</button>
        <button style="flex:1;border:2px solid var(--text);border-radius:8px;padding:9px 0;font-size:15px;font-family:var(--mono);font-weight:600;color:#fff;background:var(--text);cursor:pointer;text-align:center;">0.2N</button>
        <button style="flex:1;border:2px solid var(--border);border-radius:8px;padding:9px 0;font-size:15px;font-family:var(--mono);font-weight:600;color:var(--muted);background:#f8fafc;cursor:pointer;text-align:center;">0.3N</button>
        <button style="flex:1;border:2px solid var(--border);border-radius:8px;padding:9px 0;font-size:15px;font-family:var(--mono);font-weight:600;color:var(--muted);background:#f8fafc;cursor:pointer;text-align:center;">0.4N</button>
        <button style="flex:1;border:2px solid var(--border);border-radius:8px;padding:9px 0;font-size:15px;font-family:var(--mono);font-weight:600;color:var(--muted);background:#f8fafc;cursor:pointer;text-align:center;">0.5N</button>
      </div>
    </div>

    <div>
      <div style="font-size:20px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:16px;">血流估算（自动）</div>
      <div style="background:#f8fafc;border:2px solid var(--border);border-radius:9px;padding:16px;transition:all .2s;">
        <div style="font-size:16px;color:var(--muted);margin-bottom:6px;font-weight:500;">血流 FLOW 下降率 ΔFlow</div>
        <div style="font-size:26px;font-weight:700;font-family:var(--mono);color:#2563eb;margin-bottom:6px;">— %</div>
        <div style="font-size:11px;color:var(--faint);margin-top:6px;line-height:1.5;font-style:italic;">模型估算，仅供参考</div>
      </div>
    </div>
  </div>

  <!-- 中央3D可视化区域 -->
  <div class="center">
    <div style="padding:14px 20px 12px;border-bottom:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
      <div>
        <div style="font-size:20px;font-weight:700;letter-spacing:-.2px;">3D 耳廓接触分析</div>

    </div>
    <div class="canvas-wrap">
      <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#ffffff;">

          <div style="width:200px;height:300px;background:#f8fafc;border:2px dashed var(--border);border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
            3D耳廓模型区域
          </div>
          <p>热力图可视化区域</p>
          <p style="font-size:14px;">(Three.js 3D模型已简化)</p>
        </div>
      </div>
      <div class="hm-legend">
        <span style="color:#ef4444;font-weight:600;">低</span>
        <div class="hm-bar"></div>
        <span style="color:#16c784;font-weight:600;">高</span>
      </div>
    </div>
    <div style="height:40px;background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:20px;flex-shrink:0;">
      <div style="display:flex;align-items:center;gap:8px;font-size:16px;color:var(--muted);white-space:nowrap;">
        <strong style="color:var(--text);font-weight:700;font-family:var(--mono);">—</strong> N
      </div>
      <div style="width:2px;height:22px;background:var(--border);flex-shrink:0;"></div>
      <div style="display:flex;align-items:center;gap:8px;font-size:16px;color:var(--muted);white-space:nowrap;">
        <strong style="color:var(--text);font-weight:700;font-family:var(--mono);">—</strong> mm²
      </div>
    </div>
  </div>

  <!-- 右侧评估结果 -->
  <div class="right">
    <div style="font-size:20px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;">评估结果</div>
    <div class="scard">
      <div class="scard-lbl">综合舒适度评分</div>
      <div class="scard-num">—</div>
      <div style="font-size:21px;font-weight:400;color:var(--muted);">/ 7</div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:11px;">
      <div style="background:#f8fafc;border:2px solid var(--border);border-radius:11px;padding:15px 16px;">
        <div style="display:flex;align-items:center;gap:4px;font-size:20px;color:var(--muted);margin-bottom:8px;">接触力</div>
        <div style="font-size:28px;font-weight:800;font-family:var(--mono);line-height:1;display:flex;align-items:baseline;gap:3px;transition:.4s;">—<span style="font-size:15px;font-weight:400;color:var(--muted);">N</span></div>
      </div>
      <div style="background:#f8fafc;border:2px solid var(--border);border-radius:11px;padding:15px 16px;">
        <div style="display:flex;align-items:center;gap:4px;font-size:20px;color:var(--muted);margin-bottom:8px;">血流下降率</div>
        <div style="font-size:28px;font-weight:800;font-family:var(--mono);line-height:1;display:flex;align-items:baseline;gap:3px;transition:.4s;">—<span style="font-size:15px;font-weight:400;color:var(--muted);">%</span></div>
      </div>
      <div style="background:#f8fafc;border:2px solid var(--border);border-radius:11px;padding:15px 16px;">
        <div style="display:flex;align-items:center;gap:4px;font-size:20px;color:var(--muted);margin-bottom:8px;">接触面积</div>
        <div style="font-size:28px;font-weight:800;font-family:var(--mono);line-height:1;display:flex;align-items:baseline;gap:3px;transition:.4s;">—<span style="font-size:15px;font-weight:400;color:var(--muted);">mm²</span></div>
      </div>
      <div style="background:#f8fafc;border:2px solid var(--border);border-radius:11px;padding:15px 16px;">
        <div style="display:flex;align-items:center;gap:4px;font-size:20px;color:var(--muted);margin-bottom:8px;">预测区间</div>
        <div style="font-size:28px;font-weight:800;font-family:var(--mono);line-height:1;display:flex;align-items:baseline;gap:3px;transition:.4s;">—</div>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:8px;font-size:22px;font-weight:600;color:#d97706;margin-bottom:16px;">优化建议</div>
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div style="display:flex;gap:10px;font-size:20px;color:var(--muted);line-height:1.6;">
        <div style="width:28px;height:28px;background:#fef3c7;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700;color:#d97706;flex-shrink:0;margin-top:1px;">—</div>
        <span>请设置参数以获取建议</span>
      </div>
    </div>
  </div>
</div>
